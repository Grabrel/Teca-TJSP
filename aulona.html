const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const completed=()=>Object.values(state.read).filter(Boolean).length;
const totalQuiz=()=>Object.keys(state.ans).length;
const correct=()=>Object.keys(state.ans).filter(k=>state.ans[k]===SLIDES[+k].answer).length;
function app(html){$('content').innerHTML=html;window.scrollTo({top:0,behavior:'instant'});nav();}
function nav(){let category=screen==='slide'?SLIDES[current].cat:'';$('nav').innerHTML=CATS.map(c=>`<button class="nav ${c===category?'active':''}" onclick="category('${c}')"><span>${esc(c)}</span><small>${SLIDES.filter(s=>s.cat===c).length}</small></button>`).join('')}
function category(c){screen='category';let ids=SLIDES.map((s,i)=>({s,i})).filter(x=>x.s.cat===c);let units=ids.filter(x=>x.s.phase===0);app(`<section class="stage"><span class="eyebrow">Matéria do concurso</span><h1>${esc(c)}</h1><p class="intro">${units.length} assuntos em ${ids.length} slides. Cada assunto tem explicação, exemplo e questão comentada.</p><div class="mapgrid">${units.map(({s,i})=>`<button class="item" onclick="openSlide(${i})">${state.read[i]?'✓':'◯'} <b>${esc(s.chapter)}</b><div class="muted sm">Slides ${i+1} a ${i+3} · ${state.read[i+2]?'testado':'não testado'}</div></button>`).join('')}</div></section>`)}
function home(){screen='home';app(`<section class="stage"><span class="eyebrow">Aulona completa · preparação independente</span><h1>Teca Academia<br><span style="color:var(--mint)">Escrevente TJ-SP 2026</span></h1><p class="intro">${SLIDES.length} slides em linguagem acessível, com analogias, exemplos e exercícios. Curso offline, com progresso local e um tema por vez.</p><div class="panel"><div class="grid"><div class="tile"><span class="muted sm">Slides</span><strong>${SLIDES.length}</strong><span class="muted sm">${SLIDES.length/3} assuntos</span></div><div class="tile"><span class="muted sm">Concluídos</span><strong>${completed()}</strong><span class="muted sm">${Math.round(completed()/SLIDES.length*100)}% do curso</span></div><div class="tile"><span class="muted sm">Testes</span><strong>${correct()}/${totalQuiz()}</strong><span class="muted sm">acertos / respondidos</span></div></div><div class="progress"><i style="width:${completed()/SLIDES.length*100}%"></i></div><div class="tools"><button class="btn primary" onclick="openSlide(${Math.max(0,SLIDES.findIndex((s,i)=>!state.read[i]))})">▶ Continuar estudando</button><button class="btn" onclick="viewMap()">Explorar ${SLIDES.length} slides</button><button class="btn" onclick="viewErrors()">Revisar erros</button></div></div><h2 style="margin-top:28px">Escolha uma matéria</h2><div class="grid">${CATS.map(c=>`<button class="item" onclick="category('${c}')"><b>${esc(c)}</b><div class="muted sm">${SLIDES.filter(s=>s.cat===c).length} slides</div></button>`).join('')}</div><div class="well" style="margin-top:25px"><h3>Importante sobre as fontes</h3><p>A fonte principal é o Edital 02/2026 anexado. A prova de 07/12/2025 informa os tipos de cobrança, mas não substitui o edital atual. Referências externas e apostilas servem para orientar técnicas de estudo; nenhuma apostila privada foi copiada. Nos tópicos legais, consulte o texto integral das normas.</p></div></section>`)}
function openSlide(i){if(i<0||i>=SLIDES.length)return;current=i;screen='slide';let s=SLIDES[i],pct=(i+1)/SLIDES.length*100;let ans=state.ans[i];let head=`<div class="meta"><span class="tag">${esc(s.cat)}</span><span class="muted sm">Slide ${i+1} de ${SLIDES.length}</span><span class="muted sm">Assunto ${s.unit+1} · Etapa ${s.phase+1}/3</span></div><div class="progress"><i style="width:${pct}%"></i></div><h1>${esc(s.chapter)}</h1><p class="muted">${['1. Entenda o conceito','2. Aplique num exemplo','3. Resolva uma questão'][s.phase]}</p>`;
let body='';if(s.phase===0)body=`<div class="well"><h3>🧸 Explicação como para uma criança</h3><p class="story">${esc(s.idea)}</p></div><div class="well" style="margin-top:13px"><h3>📘 Agora a regra de verdade</h3><p>${esc(s.explain)}</p></div><div class="well example" style="margin-top:13px"><h3>🎯 Sua missão antes de avançar</h3><p>${esc(s.activity)}</p></div>`;
if(s.phase===1)body=`<div class="well example"><h3>🔍 Exemplo resolvido, passo a passo</h3><p class="story">${esc(s.example)}</p></div><div class="well" style="margin-top:13px"><h3>De onde veio essa resposta?</h3><p>${esc(s.explain)}</p></div><div class="well warn" style="margin-top:13px"><h3>⚠️ Pegadinha para não cair</h3><p id="trap" style="display:none">${esc(s.pitfall)}</p><button class="btn" onclick="this.style.display='none';$('trap').style.display='block'">Revelar pegadinha</button></div>`;
if(s.phase===2)body=`<div class="well"><h3>🧠 Hora de pensar sozinho</h3><p class="question">${esc(s.question)}</p></div><div style="margin-top:18px">${s.options.map((o,j)=>`<button class="choice ${ans!==undefined?(j===s.answer?'correct':j===ans?'wrong':''):''}" onclick="answer(${i},${j})" ${ans!==undefined?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>${ans!==undefined?`<div class="feedback ${ans===s.answer?'':'bad'}"><b>${ans===s.answer?'✅ Acertou!':'❌ Ainda não. Resposta correta: '+ 'ABCD'[s.answer]}</b><p>${esc(s.why)}</p><p><b>Conceito:</b> ${esc(s.explain)}</p><p><b>Para não errar:</b> ${esc(s.pitfall)}</p><button class="btn" onclick="retry(${i})">↻ Tentar outra vez</button></div>`:'<p class="muted sm">A explicação e a alternativa certa aparecem somente depois de responder.</p>'}`;
app(`<article class="stage">${head}<div class="panel">${body}${s.law?`<p class="muted sm" style="margin-top:18px">📖 Referência: ${esc(s.law)}</p>`:''}<div class="navfoot"><button class="btn" onclick="openSlide(${i-1})" ${i===0?'disabled':''}>← Anterior</button><div class="tools"><button class="btn" onclick="fav(${i})">${state.fav[i]?'★ Favorito':'☆ Favoritar'}</button><button class="btn primary" onclick="finish(${i})">${i===SLIDES.length-1?'Concluir curso':'Marcar e avançar →'}</button></div></div></div><div class="well" style="margin-top:18px"><h3>📝 Suas anotações, salvas no navegador</h3><textarea class="note" placeholder="Explique com suas palavras, anote uma dúvida ou crie seu próprio exemplo…" oninput="writeNote(${i},this.value)">${esc(state.notes[i]||'')}</textarea></div></article>`)}
function finish(i){state.read[i]=true;save();i===SLIDES.length-1?home():openSlide(i+1)}function answer(i,j){state.ans[i]=j;save();openSlide(i)}function retry(i){delete state.ans[i];save();openSlide(i)}function fav(i){state.fav[i]=!state.fav[i];save();openSlide(i)}function writeNote(i,val){state.notes[i]=val;save()}
function viewMap(){screen='map';app(`<section class="stage"><span class="eyebrow">Índice completo</span><h1>${SLIDES.length} slides</h1><p class="intro">Filtre pelo tema e abra qualquer slide.</p><input id="query" class="search" placeholder="Buscar: crase, eproc, Excel, tutela..." oninput="filter(this.value)"/><div id="results"></div></section>`);filter('')}
function filter(q){q=q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');let arr=SLIDES.map((s,i)=>({s,i})).filter(({s})=>(s.title+' '+s.explain+' '+s.cat).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q));$('results').innerHTML=`<p class="muted sm">${arr.length} slides encontrados</p><div class="mapgrid">${arr.map(({s,i})=>`<button class="item" onclick="openSlide(${i})">${state.read[i]?'✓':'◯'} <b>${esc(s.title)}</b><div class="muted sm">${esc(s.cat)} · slide ${i+1}</div></button>`).join('')}</div>`}
function viewErrors(){screen='errors';let arr=Object.keys(state.ans).map(Number).filter(i=>state.ans[i]!==SLIDES[i].answer);app(`<section class="stage"><span class="eyebrow">Caderno de erros</span><h1>Erros para revisar</h1><p class="intro">${arr.length?`Você tem ${arr.length} questões erradas. Revise a explicação e refaça sem olhar.`:'Nenhuma questão errada registrada por enquanto.'}</p><div class="mapgrid">${arr.map(i=>`<button class="item" onclick="openSlide(${i})">↻ ${esc(SLIDES[i].chapter)} · slide ${i+1}</button>`).join('')}</div></section>`)}
function viewFavorites(){screen='favorites';let arr=Object.keys(state.fav).map(Number).filter(i=>state.fav[i]);app(`<section class="stage"><h1>Meus favoritos</h1><div class="mapgrid">${arr.map(i=>`<button class="item" onclick="openSlide(${i})">★ ${esc(SLIDES[i].title)}</button>`).join('')}</div></section>`)}
function viewSources(){screen='sources';app(`<section class="stage sources"><span class="eyebrow">Transparência editorial</span><h1>Fontes e limites</h1><div class="panel"><p>O edital original que você enviou é a referência principal para a lista de conteúdos, datas e exigências. As aulas e questões são autorais, para treino. Os sites de preparação consultados foram usados como referências de organização, nunca para copiar textos de apostilas protegidas.</p><ol><li><b>TJ-SP, Edital 02/2026</b> — arquivo anexado de 63 páginas; Anexo VIII nas páginas 61–63. <a href="https://www.vunesp.com.br/TJSP2607" target="_blank" rel="noopener">Página oficial Vunesp</a>.</li><li><b>Vunesp 2025, Escrevente TJ-SP</b> — prova de 07/12/2025, 70 itens e redação. <a href="https://www.qconcursos.com/questoes-de-concursos/provas/vunesp-2025-tj-sp-escrevente-tecnico-judiciario" target="_blank" rel="noopener">Página da prova anterior</a>.</li><li><b>Plano de estudos TJ-SP por tópicos do edital</b> — referência de organização didática. <a href="https://tjsp.ncodes.com.br/" target="_blank" rel="noopener">Plano de estudos</a>.</li><li><b>ESCUDO Concursos, apresentação da apostila 2026</b> — referência de estrutura capítulo, mapa, quadro e questão; material comercial não reproduzido. <a href="https://escudoconcursos.github.io/escrevente-tjsp-2026/" target="_blank" rel="noopener">Descrição da apostila</a>.</li><li><b>Concurseiro RPG</b> — análise independente de questões de provas anteriores para contextualizar estilos e armadilhas. <a href="https://concurseirorpg.com.br/guias/provas-anteriores-escrevente-tjsp-vunesp" target="_blank" rel="noopener">Análise histórica</a>.</li><li>Legislação oficial: <a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noopener">Constituição</a>, <a href="https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm" target="_blank" rel="noopener">Código Penal</a>, <a href="https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689.htm" target="_blank" rel="noopener">CPP</a>, <a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105.htm" target="_blank" rel="noopener">CPC</a>, <a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm" target="_blank" rel="noopener">LBI</a> e normas do TJ indicadas no Anexo VIII.</li></ol><hr><p><b>Atenção:</b> estes slides são uma introdução extensa, não substituem os artigos integrais e não cobrem necessariamente todas as exceções de cada norma. Alterações posteriores, correções do edital e atualidades devem ser conferidas em fontes oficiais atualizadas. Os links externos precisam de internet; as aulas e exercícios funcionam offline.</p></div></section>`)}
function viewSettings(){screen='settings';app(`<section class="stage"><h1>Configurações</h1><div class="panel"><h2>Seus estudos</h2><p>${completed()} slides completos · ${totalQuiz()} testes · ${correct()} acertos.</p><p>O modo foco esconde o menu. O cronômetro ajuda a organizar uma sessão; sair da aba NÃO apaga seu curso. Suas notas permanecem salvas neste navegador.</p><div class="tools"><button class="btn" onclick="exportData()">↓ Exportar progresso (.json)</button><button class="btn" onclick="$('importer').click()">↑ Importar progresso</button><input id="importer" type="file" accept=".json" style="display:none" onchange="importData(this)"><button class="btn" onclick="if(confirm('Apagar todo o progresso?')){state={read:{},ans:{},notes:{},fav:{},font:1};save();home()}">Apagar progresso</button></div></div></section>`)}
function exportData(){let b=new Blob([JSON.stringify({version:'teca-mega-v2',state},null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='teca_academia_progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(inp){if(!inp.files[0])return;inp.files[0].text().then(t=>{let d=JSON.parse(t);if(d.version!=='teca-mega-v2')throw Error('Invalid');state=d.state;save();home();alert('Progresso importado!')}).catch(()=>alert('Arquivo de progresso inválido.'))}
function toggleFocus(){document.body.classList.toggle('focus');$('focusbtn').textContent=document.body.classList.contains('focus')?'Sair do foco':'Modo foco'}
function resize(){state.font=state.font>=1.35?1:Math.round((state.font+.1)*100)/100;document.documentElement.style.fontSize=16*state.font+'px';save()}
function timerDraw(){$('timer').textContent=(running?'Ⅱ ':'▶ ')+String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}
function timerToggle(){if(timer===0)timer=1500;running=!running;if(running)timerHandle=setInterval(()=>{timer--;timerDraw();if(timer<=0){clearInterval(timerHandle);running=false;alert('Hora de uma pausa. Bom trabalho!')}},1000);else clearInterval(timerHandle);timerDraw()}
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(screen==='slide'&&e.key==='ArrowRight'&&current<SLIDES.length-1)openSlide(current+1);if(screen==='slide'&&e.key==='ArrowLeft'&&current>0)openSlide(current-1)});
home();
window.tecaContextHelp=function(){
 if(screen==='slide'){
  const s=SLIDES[current];const phase=['Entenda o conceito','Exemplo aplicado','Teste o aprendizado'][s.phase];
  return {title:'Ajuda · '+s.chapter,body:'<p><strong>Matéria:</strong> '+esc(s.cat)+' · '+phase+'</p><p>'+esc(s.explain)+'</p><h3>Exemplo</h3><p>'+esc(s.example)+'</p><h3>Armadilha comum</h3><p>'+esc(s.pitfall)+'</p><p>Use as setas para passar de etapa. Marque o slide como concluído quando terminar. Você também pode favoritar e fazer anotações.</p>'};
 }
 if(screen==='category')return {title:'Ajuda · Matérias',body:'<p>Escolha o assunto que deseja estudar. Cada tema tem três etapas: entender, aplicar e testar.</p><p>O progresso fica salvo neste navegador.</p>'};
 if(screen==='map')return {title:'Ajuda · Índice de aulas',body:'<p>Pesquise por palavras como crase, Excel ou Direito. Clique no resultado para abrir diretamente o slide correspondente.</p>'};
 if(screen==='errors')return {title:'Ajuda · Revisão de erros',body:'<p>Aqui aparecem os testes respondidos incorretamente. Refaça-os depois de revisar a explicação e os exemplos.</p>'};
 if(screen==='favorites')return {title:'Ajuda · Favoritos',body:'<p>Esta lista reúne slides que você marcou para rever. É uma forma rápida de montar seu próprio plano de revisão.</p>'};
 if(screen==='settings')return {title:'Ajuda · Configurações e backup',body:'<p>Exporte seu progresso em JSON para fazer backup. Importe o arquivo para recuperar o histórico nesse navegador. Apagar progresso é irreversível sem backup.</p>'};
 if(screen==='sources')return {title:'Ajuda · Referências',body:'<p>Consulte links oficiais e materiais de apoio. Informações normativas e datas devem sempre ser conferidas no edital vigente.</p>'};
 return {title:'Ajuda · Aulona',body:'<p>Este ambiente contém '+SLIDES.length+' slides organizados por matérias. Use <strong>Continuar estudando</strong> para retornar ao primeiro slide não concluído.</p><p>Você pode revisar erros, usar o cronômetro, ajustar o texto e ativar o modo foco.</p>'};
};
(function(){let qs=new URLSearchParams(location.search);let busca=qs.get('busca'),categoria=qs.get('categoria');if(!busca&&!categoria)return;
 const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let words=norm(busca).split(/[^a-z0-9]+/).filter(w=>w.length>=4);
 let scored=SLIDES.map((s,i)=>{let content=norm(s.chapter+' '+s.title+' '+s.explain),title=norm(s.chapter+' '+s.title);let score=words.reduce((n,w)=>n+(title.includes(w)?6:content.includes(w)?1:0),0)+(categoria&&norm(s.cat)===norm(categoria)?3:0);return {i,score}}).sort((a,b)=>b.score-a.score);
 if(scored[0]&&scored[0].score>0)openSlide(Math.max(0,scored[0].i-scored[0].i%3));
})();
</script><script src="shared.js"></script></body></html>
